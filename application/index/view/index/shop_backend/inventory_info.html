<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独立站平台 - website.gogo198.net</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="layui/css/layui.css">
    <style>
        :root {--primary: #8a2be2;--primary-dark: #6a1cb9;--primary-light: #9b4de3;--secondary: #bb86fc;--accent: #e6d7f5;--text: #333333;--text-light: #f8f8f8;--background: #f9f5fd;--card-bg: #ffffff;--gradient: linear-gradient(135deg, var(--primary), var(--primary-dark));--gradient-light: linear-gradient(135deg, var(--primary-light), var(--secondary));--shadow: 0 10px 30px rgba(138, 43, 226, 0.15);--shadow-hover: 0 15px 35px rgba(138, 43, 226, 0.25);}
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        body {color: var(--text);line-height: 1.6;overflow-x: hidden;}
        h1, h2, h3, h4, h5, h6 {font-family: 'Montserrat', sans-serif;font-weight: 700;}
        .disf{display:flex;align-items: center;}

        .btn {padding: 12px 25px;border-radius: 50px;text-decoration: none;font-weight: 600;transition: all 0.3s ease;cursor: pointer;display: inline-block;text-align: center;border: none;font-family: 'Montserrat', sans-serif;}
        .btn-outline {border: 2px solid var(--primary);color: var(--primary);background: transparent;margin-right: 15px;}
        .btn-outline:hover {background: var(--primary);color: white;transform: translateY(-3px);box-shadow: var(--shadow);}
        .btn-primary {background: var(--gradient);color: white;border: 2px solid transparent;}
        .btn-primary:hover {background: transparent;border-color: var(--primary);color: var(--primary);transform: translateY(-3px);box-shadow: var(--shadow);}
        .btn-default{padding:padding:10px 10px;background: var(--primary);}

        /* 模态框样式 */
        .modal {display: none;position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0, 0, 0, 0.5);backdrop-filter: blur(5px);z-index: 2000;align-items: center;justify-content: center;}
        .modal-content {background: white;border-radius: 20px;padding: 30px;width: 90%;max-width: 90%;box-shadow: var(--shadow-hover);position: relative;}
        .close-modal {position: absolute;top: 20px;right: 20px;font-size: 1.5rem;color: #999;cursor: pointer;transition: color 0.3s ease;}
        .close-modal:hover {color: var(--primary);}
        .modal-title {font-size: 1.5rem;margin-bottom: 20px;color: var(--primary);}

        /* 表单样式 */
        .form-section {margin-bottom: 30px;}
        .form-title {font-size: 1.3rem;margin-bottom: 20px;color: var(--primary-dark);display: flex;align-items: center}
        .form-title i {margin-right: 10px;}
        .form-grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));gap: 20px;}
        .form-group {margin-bottom: 20px;}
        .form-group label {display: block;margin-bottom: 8px;font-weight: 600;color: var(--primary-dark);}
        .form-group input,
        .form-group select,
        .form-group textarea {width: 100%;padding: 15px;border: 2px solid #e0e0e0;border-radius: 10px;font-size: 1rem;transition: border-color 0.3s ease;}
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {border-color: var(--primary);outline: none;}
        .form-group textarea {min-height: 120px;resize: vertical;}
        .form-actions {display: flex;justify-content: flex-end;gap: 15px;margin-top: 30px;padding-top: 20px;border-top: 2px solid var(--accent);}

        .sel_container .sel_line{margin-bottom:5px;}
        .trush_box{display:none;}
        .trush_box .trush{padding: 6px 6px;border: 1px solid #efefef;color: #6d6d6d;cursor: pointer;}
        .currency_symbol{font-size: 15px;}
        .amount{margin-left:5px;font-size: 15px;}
        
        .zdmx .layui-input-block{line-height:36px;}
        
        /* 动画 */
        @keyframes fadeIn {
            from {opacity: 0;transform: translateY(10px);}
            to {opacity: 1;transform: translateY(0);}
        }


        @media (max-width: 576px) {
            .btn {padding: 10px 20px;font-size: 0.9rem;}
            /*.form-actions {flex-direction: column;}*/
        }

        /*自定义颜色配置*/
        .layui-colorpicker.layui-colorpicker-lg,.layui-colorpicker-trigger-i.layui-icon-close{line-height: 24px;}
        .layui-colorpicker, .layui-colorpicker-trigger-span{border-color:#777;}
        .layui-colorpicker-main-input .layui-btn-container .layui-btn {margin: 0 0 0 5px;}
        .layui-form-item .layui-form-label{width:100px;}

        .edui-editor{z-index: 1 !important;}
        
        /*返回按钮*/
        .backDiv{padding: 5px 5px 5px 20px;border-bottom: 1px solid #d9d9d9;}
        .backDiv .backBox{display: flex;align-items: center;cursor: pointer;}
        .backDiv .back_icon{font-size: 18px;color: #333;margin-right: 10px;position: relative;}
        .backDiv .back_icon:before{content:'';position:absolute;width:9px;height:9px;border-left:2px solid #000;border-top:2px solid #000;transform:rotate(-45deg);margin-right:5px;top:-7px;}
        .backDiv .back_text{font-size: 16px;color: #333;font-weight: 500;margin-left: 5px;}
        
        /* 添加到现有的CSS中 */
        .confirm-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .confirm-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .confirm-item.confirmed {
            border-color: #67c23a;
            background: rgba(103, 194, 58, 0.05);
        }
        
        .confirm-item.rejected {
            border-color: #f56c6c;
            background: rgba(245, 108, 108, 0.05);
        }
        
        .confirm-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .confirm-title {
            font-weight: 600;
            color: var(--primary-dark);
        }
        
        .confirm-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-pending {
            background: #f0f9ff;
            color: #409eff;
        }
        
        .status-confirmed {
            background: #f0f9eb;
            color: #67c23a;
        }
        
        .status-rejected {
            background: #fef0f0;
            color: #f56c6c;
        }
        
        .confirm-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .confirm-field {
            display: flex;
            flex-direction: column;
        }
        
        .confirm-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .confirm-value {
            font-weight: 500;
        }
        
        .stock-change {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        
        .stock-increase {
            background: rgba(103, 194, 58, 0.1);
            color: #67c23a;
        }
        
        .stock-decrease {
            background: rgba(245, 108, 108, 0.1);
            color: #f56c6c;
        }
        
        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        #confirmStatus.success {
            border-left: 4px solid #67c23a;
            background: rgba(103, 194, 58, 0.05);
        }
        
        #confirmStatus.error {
            border-left: 4px solid #f56c6c;
            background: rgba(245, 108, 108, 0.05);
        }
        
        #confirmStatus.warning {
            border-left: 4px solid #e6a23c;
            background: rgba(230, 162, 60, 0.05);
        }
    </style>
</head>
<body>
<div class="backDiv">
    <div class="backBox" onclick="javascript:window.history.back(-1);">
        <div class="back_icon"></div>
        <div class="back_text">返回</div>
    </div>
</div>
<form id="siteForm" class="layui-form" action="" method="post" lay-filter="component-form-menu" style="padding:10px;margin-bottom:0px;">
    <input type="hidden" name="company_id" value="{$company_id}">
    <input type="hidden" name="company_type" value="{$company_type}">
    
    <div class="layui-form-item">
        <div class="layui-form-label">库存模板</div>
        <div class="layui-input-block">
            <div class="layui-upload" id="contract_type" style="margin-top: 10px;">
                <button type="button" class="layui-btn" id="temp_file-upload">上传模板</button>
                <a href="/uploads/goods_inventory/更新商品库存模板.xlsx" download style="color:#ff2222;text-decoration:underline;margin-left:10px;">下载模板</a>
                <!--                                    <blockquote class="layui-elem-quote layui-quote-nm yulan" style="margin-top: 10px;">-->
                <!--                                        预览图：-->
                <!--                                        <div class="layui-upload-list" id="temp_file-upload-list">-->

                <!--                                        </div>-->
                <!--                                    </blockquote>-->
            </div>
        </div>
    </div>
</form>

<div id="inventoryConfirmArea" style="display: none; margin-top: 30px; padding: 20px; background: var(--background); border-radius: 10px; border: 2px solid var(--accent);">
    <h3 style="color: var(--primary); margin-bottom: 20px; display: flex; align-items: center;">
        <i class="layui-icon layui-icon-vercode" style="margin-right: 10px;"></i>库存更新确认
        <span id="confirmCount" style="margin-left: 10px; font-size: 14px; color: #666;"></span>
    </h3>
    
    <!-- 确认状态提示 -->
    <div id="confirmStatus" style="display: none;" class="layui-elem-quote layui-quote-nm">
        <div id="statusText" style="font-weight: 500;"></div>
    </div>
    
    <!-- 库存更新列表 -->
    <div id="inventoryList" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;padding-top:2px;">
        <!-- 数据将通过JS动态生成 -->
    </div>
    
    <!-- 操作按钮 -->
    <div class="form-actions" id="confirmActions">
        <button type="button" class="btn btn-outline" id="confirmAllBtn">
            <i class="layui-icon layui-icon-ok-circle"></i> 全部确认
        </button>
        <button type="button" class="btn btn-primary" id="submitConfirmBtn" disabled>
            <i class="layui-icon layui-icon-release"></i> 提交确认
        </button>
        <button type="button" class="btn btn-outline" id="cancelConfirmBtn" style="background: #f56c6c; color: white; border-color: #f56c6c;">
            <i class="layui-icon layui-icon-close"></i> 取消确认
        </button>
    </div>
</div>

<!-- 确认详情模态框 -->
<div class="modal" id="detailModal">
    <div class="modal-content" style="max-width: 600px;">
        <span class="close-modal close-detail-modal">&times;</span>
        <h2 class="modal-title">库存变更详情</h2>
        <div class="form-section">
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="detailGoodsName" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">

            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>原库存</label>
                    <input type="text" id="detailOriginStock" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>现库存</label>
                    <input type="text" id="detailNowStock" readonly style="background: #f5f5f5;">
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>商品SN</label>
                    <input type="text" id="detailGoodsSn" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>商品条形码</label>
                    <input type="text" id="detailGoodsBarcode" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>商品库存编码</label>
                    <input type="text" id="detailGoodsStockcode" readonly style="background: #f5f5f5;">

            </div>
            <div class="form-group">

        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-outline" id="rejectChangeBtn">
                <i class="layui-icon layui-icon-close"></i> 拒绝变更
            </button>
            <button type="button" class="btn btn-primary" id="confirmSingleBtn">
                <i class="layui-icon layui-icon-ok"></i> 确认变更
            </button>
        </div>
    </div>
</div>

<!-- 添加轮播图·模态框 -->
<div class="modal" id="saveMenuModal">
    <div class="modal-content" style="/**min-height:600px;max-height:600px;**/overflow-y:auto;">
        <span class="close-modal close-modal-menu">&times;</span>
        <h2 class="modal-title">保存信息</h2>
        <iframe src="" class="menu_iframe" frameborder="0" style="width: 100%;height:400px;"></iframe>

<script src="./layui/xm-select.js"></script>
<script src="js/jquery-3.6.0.min.js"></script>
<script src="layui/layui.js"></script>
<script>
    // 全局变量存储确认数据
    let confirmData = [];
    let currentDetailIndex = null;
    
    // 渲染确认列表
    function renderConfirmList(data) {
        const container = $('#inventoryList');
        const countSpan = $('#confirmCount');
        
        container.empty();
        confirmData = data.map((item, index) => ({
            ...item,
            id: index,
            status: 'pending', // pending, confirmed, rejected
            confirmed: false
        }));
        
        // 更新计数
        countSpan.text(`(${confirmData.length} 项待确认)`);
        
        // 渲染每一项
        confirmData.forEach((item, index) => {
            const change = parseInt(item.now_goods_num) - parseInt(item.origin_goods_num);
            const changeClass = change >= 0 ? 'stock-increase' : 'stock-decrease';
            const changeText = change >= 0 ? `+${change}` : change;
            const changeType = change >= 0 ? '+' : '-';
            
            const itemHtml = `
                <div class="confirm-item" data-index="${index}" id="confirmItem-${index}">
                    <div class="confirm-header">
                        <div class="confirm-title">${item.goods_name}</div>
                        <div class="confirm-status status-pending">待确认</div>
                    </div>
                    <div class="confirm-content">
                        <div class="confirm-field">
                            <span class="confirm-label">规格名称</span>
                            <span class="confirm-value">${item.sku_name}</span>
                        </div>
                        <div class="confirm-field">
                            <span class="confirm-label">原库存</span>
                            <span class="confirm-value">${item.origin_goods_num}</span>
                        </div>
                        <div class="confirm-field">
                            <span class="confirm-label">现库存</span>
                            <span class="confirm-value">${item.now_goods_num}</span>
                        </div>
                        <div class="confirm-field">
                            <span class="confirm-label">变更</span>
                            <span class="confirm-value">
                                <span class="stock-change ${changeClass}">${changeType} ${Math.abs(change)}</span>
                            </span>
                        </div>
                    </div>
                    <div class="confirm-actions">
                        <button type="button" class="btn btn-outline btn-small view-detail" data-index="${index}" style="display:none;">
                            <i class="layui-icon layui-icon-search"></i> 查看详情
                        </button>
                        <button type="button" class="btn btn-primary btn-small confirm-single" data-index="${index}">
                            <i class="layui-icon layui-icon-ok"></i> 确认
                        </button>
                        <button type="button" class="btn btn-outline btn-small reject-single" data-index="${index}" style="color: #f56c6c; border-color: #f56c6c;">
                            <i class="layui-icon layui-icon-close"></i> 拒绝
                        </button>
                    </div>
                </div>
            `;
            container.append(itemHtml);
        });
        
        // 显示确认区域
        $('#inventoryConfirmArea').show();
        updateSubmitButton();
    }
    
    // 更新提交按钮状态
    function updateSubmitButton() {
        const confirmedCount = confirmData.filter(item => item.confirmed).length;
        const totalCount = confirmData.length;
        const submitBtn = $('#submitConfirmBtn');
        
        if (confirmedCount === totalCount && totalCount > 0) {
            submitBtn.prop('disabled', false).text(`提交确认 (${confirmedCount}/${totalCount})`);
            $('#confirmAllBtn').prop('disabled', true).text('已全部确认');
        } else {
            if(confirmedCount>0){
                submitBtn.prop('disabled', false).text(`提交确认 (${confirmedCount}/${totalCount})`);
            }else{
                submitBtn.prop('disabled', true).text(`提交确认 (${confirmedCount}/${totalCount})`);
            }
            $('#confirmAllBtn').prop('disabled', false).text('全部确认');
        }
    }
    
    // 显示详情模态框
    function showDetailModal(index) {
        const item = confirmData[index];
        if (!item) return;
        
        currentDetailIndex = index;
        const change = parseInt(item.now_goods_num) - parseInt(item.origin_goods_num);
        
        // 填充详情数据
        $('#detailGoodsName').val(item.goods_name);
        $('#detailSkuName').val(item.sku_name);
        $('#detailOriginStock').val(item.origin_goods_num);
        $('#detailNowStock').val(item.now_goods_num);
        $('#detailGoodsSn').val(item.goods_sn);
        $('#detailGoodsBarcode').val(item.goods_barcode);
        $('#detailGoodsStockcode').val(item.goods_stockcode);
        $('#detailChangeAmount').val(`${change >= 0 ? '+' : ''}${change}`);
        
        // 设置变更数量的颜色
        const changeInput = $('#detailChangeAmount');
        changeInput.css('color', change >= 0 ? '#67c23a' : '#f56c6c');
        
        // 显示模态框
        $('#detailModal').fadeIn();
    }
    
    // 确认单个项目
    function confirmSingleItem(index) {
        const item = confirmData[index];
        if (!item) return;
        
        // 更新状态
        item.status = 'confirmed';
        item.confirmed = true;
        
        // 更新UI
        const itemElement = $(`#confirmItem-${index}`);
        itemElement.addClass('confirmed');
        itemElement.find('.confirm-status')
            .removeClass('status-pending')
            .addClass('status-confirmed')
            .text('已确认');
        
        //隐藏“拒绝”
        itemElement.find('.reject-single').hide();
        
        // 更新确认按钮
        itemElement.find('.confirm-single').prop('disabled', true).html('<i class="layui-icon layui-icon-ok"></i> 已确认');
        itemElement.find('.reject-single').prop('disabled', true);
        
        updateSubmitButton();
        showStatus('success', `已确认：${item.goods_name} (${item.sku_name})`);
    }
    
    // 拒绝单个项目
    function rejectSingleItem(index) {
        const item = confirmData[index];
        if (!item) return;
        
        // 更新状态
        item.status = 'rejected';
        item.confirmed = false;
        
        // 更新UI
        const itemElement = $(`#confirmItem-${index}`);
        itemElement.addClass('rejected');
        itemElement.find('.confirm-status')
            .removeClass('status-pending')
            .addClass('status-rejected')
            .text('已拒绝');
        
        //隐藏“确认”
        itemElement.find('.confirm-single').hide();
        
        // 更新按钮
        itemElement.find('.confirm-single').prop('disabled', true);
        itemElement.find('.reject-single').prop('disabled', true).html('<i class="layui-icon layui-icon-close"></i> 已拒绝');
        
        updateSubmitButton();
        showStatus('warning', `已拒绝：${item.goods_name} (${item.sku_name})`);
    }
    
    // 显示状态提示
    function showStatus(type, message) {
        const statusDiv = $('#confirmStatus');
        const statusText = $('#statusText');
        
        statusText.html(`<i class="layui-icon layui-icon-${type === 'success' ? 'ok' : 'close'}" style="margin-right: 5px;"></i>${message}`);
        statusDiv.removeClass('success error warning').addClass(type).show();
        
        // 3秒后自动隐藏
        setTimeout(() => {
            statusDiv.fadeOut();
        }, 3000);
    }
    
    // 提交确认到后端
    function submitConfirmation() {
        const confirmedItems = confirmData.filter(item => item.status === 'confirmed');
        
        if (confirmedItems.length === 0) {
            layer.msg('请先确认至少一个变更项', {icon: 2});
            return;
        }
        
        layer.load();
        
        $.ajax({
            url: '/?s=index/inventory_info',
            method: 'post',
            data: {
                company_id: "{$company_id}",
                company_type: "{$company_type}",
                confirm_data: JSON.stringify(confirmedItems),
                method: '{$method}',
                type: '{$type}',
                pa: 2  // 表示确认操作
            },
            dataType: 'JSON',
            success: function(res) {
                layer.closeAll('loading');
                
                if (res.code === 0) {
                    layer.msg(res.msg, {icon: 1, time: 2000}, function() {
                        // 清空确认区域
                        // $('#inventoryConfirmArea').hide();
                        // $('#inventoryList').empty();
                        // confirmData = [];
                        
                        window.location.reload();
                        // 如果需要重新加载页面或跳转
                        // if (res.data && res.data.redirect) {
                            // window.location.href = res.data.redirect;
                            
                        // }
                    });
                } else {
                    layer.msg(res.msg || '提交失败', {icon: 2});
                }
            },
            error: function() {
                layer.closeAll('loading');
                layer.msg('网络错误，请重试', {icon: 2});
            }
        });
    }

    layui.use(['layer','form','upload'],function() {
        var layer = layui.layer
            ,form = layui.form
            ,$ = layui.jquery
            ,upload = layui.upload;

        // 库存exl文件
        upload.render({
            elem: '#temp_file-upload'
            ,url: '/?s=index/inventory_info'
            ,accept: 'file'
            ,exts: 'xlsx'
            ,data: { folder: 'inventory',type:'{$type}','company_id':"{$company_id}",'company_type':"{$company_type}",'method':"{$method}",'pa':1}
            ,before: function(obj){
                // 清空之前的确认数据
                confirmData = [];
                $('#inventoryConfirmArea').hide();
                layer.load(); //上传loading
            }
            ,done: function(res){
                layer.closeAll('loading'); //关闭loading
                layer.msg(res.msg,{time:3000},function(){
                    if(res.code == 0){
                        if(res.data && res.data.length > 0){
                            // 渲染确认列表
                            renderConfirmList(res.data);
                            // layer.msg(res.msg, {time: 3000});
                        } else {
                            layer.msg('导入成功，没有需要更新的数据', {time: 3000});
                        }
                    } else {
                        layer.msg(res.msg || '导入失败', {time: 3000});
                    }
                });
            },error: function(){
                layer.closeAll('loading');
                layer.msg('上传失败，请检查网络或文件格式！');
            }
        });

       
        form.on('submit(component-form-menu2)', function(data){
            layer.load();

            data.field['goods_total_price'] = $('.goods_total_price').find('.amount').text();
            data.field['project_total_price'] = $('.project_total_price').find('.amount').text();
            data.field['total_price'] = $('.total_price').find('.amount').text();

            $.ajax({
                url:"/?s=index/save_procurement",
                method:'post',
                data:data.field,
                dataType:'JSON',
                success:function(res){
                    layer.closeAll('loading');
                    layer.msg(res.msg,{time:2000}, function () {
                        if(res.code == 0)
                        {
                            let currentUrl = new URL(parent.location.href);
                            // currentUrl.searchParams.set('tab', 'shop_head_menu');
                            // parent.history.pushState({}, '', currentUrl.toString());
                            if(currentUrl.href=='https://dtc.gogo198.net/?s=index/website_shop&typ={$company_type}&company_id={$company_id}'){
                                window.location.href="/?s=index/shelf_manage&company_id={$company_id}&company_type={$company_type}";
                            }else{
                                layer.confirm('请选择你的下一步操作', {
                                    btn: ['前往管理上架', '继续添加采购']
                                }, function () {
                                    $(window.top.document).find('#content-area').find('.iframe_info').attr('src','/?s=index/shelf_manage&company_id={$company_id}&company_type={$company_type}');
                                }, function () {
                                    window.location.reload();
                                });
                            }
                        }
                    });
                },
                error:function (data) {
                    layer.msg('系统错误',{time:2000});
                }
            });
            return false;
        });
    });

    // DOM加载完成后绑定事件
    $(document).ready(function() {
        // 查看详情按钮事件委托
        $(document).on('click', '.view-detail', function() {
            const index = $(this).data('index');
            showDetailModal(index);
        });
        
        // 确认单个按钮事件委托
        $(document).on('click', '.confirm-single', function() {
            const index = $(this).data('index');
            confirmSingleItem(index);
        });
        
        // 拒绝单个按钮事件委托
        $(document).on('click', '.reject-single', function() {
            const index = $(this).data('index');
            rejectSingleItem(index);
        });
        
        // 全部确认按钮
        $('#confirmAllBtn').click(function() {
            if (confirmData.length === 0) return;
            
            layer.confirm('确定要确认所有变更项吗？', {
                title: '批量确认',
                btn: ['确定', '取消']
            }, function() {
                confirmData.forEach((item, index) => {
                    if (item.status === 'pending') {
                        confirmSingleItem(index);
                    }
                });
                layer.msg('已确认所有项目', {icon: 1});
            });
        });
        
        // 提交确认按钮
        $('#submitConfirmBtn').click(function() {
            if ($(this).prop('disabled')) return;
            
            layer.confirm('确定要提交确认吗？提交后将更新库存信息。', {
                title: '提交确认',
                btn: ['确定提交', '再检查一下']
            }, function() {
                submitConfirmation();
            });
        });
        
        // 取消确认按钮
        $('#cancelConfirmBtn').click(function() {
            layer.confirm('确定要取消确认吗？未确认的数据将会丢失。', {
                title: '取消确认',
                btn: ['确定取消', '继续确认']
            }, function() {
                $('#inventoryConfirmArea').hide();
                $('#inventoryList').empty();
                confirmData = [];
                layer.msg('已取消确认', {icon: 1});
            });
        });
        
        // 详情模态框确认按钮
        $('#confirmSingleBtn').click(function() {
            if (currentDetailIndex !== null) {
                confirmSingleItem(currentDetailIndex);
                $('.close-detail-modal').click();
            }
        });
        
        // 详情模态框拒绝按钮
        $('#rejectChangeBtn').click(function() {
            if (currentDetailIndex !== null) {
                rejectSingleItem(currentDetailIndex);
                $('.close-detail-modal').click();
            }
        });
        
        // 关闭模态框
        $('.close-detail-modal').click(function() {
            $('#detailModal').fadeOut();
            currentDetailIndex = null;
        });
        
        // 点击模态框外部关闭
        $(window).click(function(event) {
            if ($(event.target).hasClass('modal')) {
                $('.modal').fadeOut();
                currentDetailIndex = null;
            }
        });
    });
    
    // 添加键盘快捷键支持
    $(document).keydown(function(e) {
        // ESC键关闭模态框
        if (e.keyCode === 27) {
            $('.modal').fadeOut();
            currentDetailIndex = null;
        }
        
        // Ctrl+Enter 提交确认
        if (e.ctrlKey && e.keyCode === 13) {
            if (!$('#submitConfirmBtn').prop('disabled')) {
                submitConfirmation();
            }
        }
    });
</script>
</html>
