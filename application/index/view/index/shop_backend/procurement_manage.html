<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>采购管理</title>
    <link rel="stylesheet" href="layui/css/layui.css">
    <style>
        /* 整体布局样式 */
        body {
            background-color: #FFFFFF;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        .layui-btn-normal{background:#9b4de3;}
        
        .current-menu {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        /* 操作按钮区域 */
        .action-buttons {
            margin-bottom: 20px;
        }
        
        /* 表格样式 */
        .procurement-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .procurement-table th {
            background-color: #f8f9fa;
            padding: 12px 15px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #eaeaea;
        }
        
        .procurement-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eaeaea;
            color: #666;
        }
        
        .procurement-table tr:hover {
            background-color: #f9f9f9;
        }
        
        /* 状态标签 */
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: normal;
        }
        
        .status-1 { background-color: #ffedd5; color: #c2410c; } /* 待处理 */
        .status-2 { background-color: #dbeafe; color: #1e40af; } /* 已确认 */
        .status-3 { background-color: #fef3c7; color: #92400e; } /* 采购中 */
        .status-4 { background-color: #d1fae5; color: #065f46; } /* 已发货 */
        .status-5 { background-color: #dcfce7; color: #166534; } /* 已完成 */
        .status-6 { background-color: #fee2e2; color: #991b1b; } /* 已取消 */
        
        /* 操作按钮 */
        /*.action-btn {*/
        /*    display: inline-block;*/
        /*    padding: 4px 8px;*/
        /*    margin-right: 5px;*/
        /*    border-radius: 4px;*/
        /*    font-size: 12px;*/
        /*    cursor: pointer;*/
        /*}*/
        .channel-actions {display: flex;gap: 10px;justify-content: center;}
        .btn {padding: 5px 10px;border-radius: 50px;font-weight: 600;cursor: pointer;transition: all 0.3s ease;display: flex;align-items: center;gap: 8px;border: none;}
        .view-btn { background-color: #3b82f6; color: white; }
        .edit-btn { background-color: #9b4de3; color: white; }
        .cancel-btn { background: transparent;color: #ff4757;border: 2px solid #ff4757;}
        
        /* 分页样式 */
        .pagination {
            margin-top: 20px;
            text-align: center;
        }
        
        .pagination a {
            display: inline-block;
            padding: 5px 12px;
            margin: 0 2px;
            border: 1px solid #ddd;
            color: #666;
            text-decoration: none;
            border-radius: 4px;
        }
        
        .pagination a:hover,
        .pagination a.active {
            background-color: #9b4de3;
            color: white;
            border-color: #9b4de3;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
        }
        
        /* 筛选表单 */
        .filter-form {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .filter-item {
            margin-right: 20px;
            margin-bottom: 10px;
        }
        
        .filter-item label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="current-menu">采购管理</div>
    
    <!-- 操作按钮区域 -->
    <div class="action-buttons">
        <button class="layui-btn layui-btn-normal" onclick="createNewProcurement()">
            <i class="layui-icon">&#xe654;</i> 新建采购单
        </button>
        <button class="layui-btn layui-btn-primary" onclick="refreshProcurementList()">
            <i class="layui-icon">&#xe669;</i> 刷新
        </button>
        <button class="layui-btn" onclick="exportProcurementData()" style="display:none;">
            <i class="layui-icon">&#xe67d;</i> 导出
        </button>
    </div>
            
    <!-- 筛选表单 -->
    <div class="filter-form" style="display:none;">
        <div class="filter-row">
            <div class="filter-item">
                <label>采购单号</label>
                <input type="text" class="layui-input" id="filterOrderNo" placeholder="输入采购单号" style="width: 200px;">
            </div>
            <div class="filter-item">
                <label>供应商</label>
                <select class="layui-select" id="filterSupplier" style="width: 200px;">
                    <option value="">全部供应商</option>
                </select>
            </div>
            <div class="filter-item">
                <label>仓库类型</label>
                <select class="layui-select" id="filterWarehouseType" style="width: 150px;">
                    <option value="">全部类型</option>
                    <option value="direct">直接发货</option>
                    <option value="proxy">代发货</option>
                </select>
            </div>
            <div class="filter-item">
                <label>状态</label>
                <select class="layui-select" id="filterStatus" style="width: 150px;">
                    <option value="">全部状态</option>
                    <option value="1">待处理</option>
                    <option value="2">已确认</option>
                    <option value="3">采购中</option>
                    <option value="4">已发货</option>
                    <option value="5">已完成</option>
                    <option value="6">已取消</option>
                </select>
            </div>
        </div>
        <div class="filter-row">
            <div class="filter-item">
                <label>创建时间</label>
                <input type="text" class="layui-input" id="filterStartDate" placeholder="开始日期" style="width: 150px;">
                <span style="margin: 0 5px;">至</span>
                <input type="text" class="layui-input" id="filterEndDate" placeholder="结束日期" style="width: 150px;">
            </div>
            <div class="filter-item">
                <button class="layui-btn layui-btn-normal" onclick="searchProcurement()">
                    <i class="layui-icon">&#xe615;</i> 搜索
                </button>
                <button class="layui-btn layui-btn-primary" onclick="resetFilter()">
                    <i class="layui-icon">&#xe669;</i> 重置
                </button>
            </div>
        </div>
    </div>
            
    <!-- 采购单列表表格 -->
    <div class="table-container">
        <table class="procurement-table" id="procurementTable">
            <thead>
                <tr>
                    <th>采购单号</th>
                    <th>供应商</th>
                    <th>仓库类型</th>
                    <th>商品数量</th>
                    <th>总金额</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="procurementList">
                <!-- 数据通过JS动态加载 -->
            </tbody>
        </table>
        
        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">📦</div>
            <p>暂无采购单数据</p>
            <button class="layui-btn layui-btn-normal" onclick="createNewProcurement()">
                <i class="layui-icon">&#xe654;</i> 创建采购单
            </button>
        </div>
        
        <!-- 分页 -->
        <div class="pagination" id="pagination">
            <!-- 分页通过JS动态生成 -->
        </div>
    </div>

<script src="layui/layui.js"></script>
<script src="js/jquery-3.6.0.min.js"></script>
<script>
// 当前页面参数
var currentPage = 1;
var pageSize = 10;
var totalPages = 0;
var totalCount = 0;
var filterParams = {};

layui.use(['laydate', 'layer', 'form'], function(){
    var laydate = layui.laydate;
    var layer = layui.layer;
    var form = layui.form;
    
    // 初始化日期选择器
    laydate.render({
        elem: '#filterStartDate',
        type: 'date'
    });
    
    laydate.render({
        elem: '#filterEndDate',
        type: 'date'
    });
    
    // 初始化供应商下拉框
    loadSuppliersForFilter();
    
    // 加载采购单数据
    loadProcurementList();
});

// 加载供应商列表（用于筛选）
function loadSuppliersForFilter() {
    $.ajax({
        url: '/?s=index/get_suppliers',
        data: {
            company_id: getUrlParam('company_id'),
            company_type: getUrlParam('company_type')
        },
        success: function(res){
            if(res.code === 0) {
                var html = '<option value="">全部供应商</option>';
                res.data.forEach(function(supplier){
                    html += '<option value="' + supplier.id + '">' + supplier.company_name + '</option>';
                });
                $('#filterSupplier').html(html);
                layui.form.render('select');
            }
        }
    });
}

// 加载采购单列表
function loadProcurementList() {
    var params = {
        company_id: getUrlParam('company_id'),
        company_type: getUrlParam('company_type'),
        page: currentPage,
        limit: pageSize
    };
    
    // 添加筛选参数
    Object.assign(params, filterParams);
    
    $.ajax({
        url: '/?s=index/procurement_manage',
        type: 'GET',
        data: params,
        dataType: 'json',
        success: function(res){
            if(res.code === 0) {
                renderProcurementList(res.data);
                renderPagination(res.count);
            } else {
                showEmptyState();
            }
        },
        error: function() {
            showEmptyState();
        }
    });
}

// 渲染采购单列表
function renderProcurementList(data) {
    var tbody = document.getElementById('procurementList');
    
    if (data.length === 0) {
        showEmptyState();
        return;
    }
    
    hideEmptyState();
    
    var html = '';
    data.forEach(function(item) {
        html += '<tr>';
        html += '<td>' + (item.id || '--') + '</td>';
        html += '<td>' + (item.supplier_name || '--') + '</td>';
        html += '<td>' + (item.warehouse_type_text || '--') + '</td>';
        html += '<td>' + (item.goods_count || 0) + '</td>';
        html += '<td>¥' + (item.total_price ? parseFloat(item.total_price).toFixed(2) : '0.00') + '</td>';
        html += '<td><span class="status-badge status-' + (item.status || 1) + '">' + (item.status_text || '待处理') + '</span></td>';
        html += '<td>' + (item.createtime || '--') + '</td>';
        html += '<td>';
        // html += '<button class="action-btn view-btn" onclick="viewProcurement(' + item.id + ')">查看</button>';
        
        if (item.status == 1) { // 待处理状态
            html += '<div class="channel-actions">';
            html += '<button class="action-btn edit-btn btn" onclick="editProcurement(' + item.id + ')">编辑</button>';
            html += '<button class="action-btn cancel-btn btn" onclick="cancelProcurement(' + item.id + ')">取消</button>';
            html += '</div>';
        }
        
        if (item.status == 4) { // 已发货状态
            html += '<div class="channel-actions">';
            html += '<button class="action-btn edit-btn btn" onclick="completeProcurement(' + item.id + ')">完成</button>';
            html += '</div>';
        }
        
        html += '</td>';
        html += '</tr>';
    });
    
    tbody.innerHTML = html;
}

// 显示空状态
function showEmptyState() {
    document.getElementById('procurementList').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('pagination').innerHTML = '';
}

// 隐藏空状态
function hideEmptyState() {
    document.getElementById('emptyState').style.display = 'none';
}

// 渲染分页
function renderPagination(total) {
    totalCount = total;
    totalPages = Math.ceil(total / pageSize);
    
    var pagination = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    var html = '';
    
    // 上一页
    if (currentPage > 1) {
        html += '<a href="javascript:;" onclick="goToPage(' + (currentPage - 1) + ')">&laquo; 上一页</a>';
    }
    
    // 页码
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    
    for (var i = startPage; i <= endPage; i++) {
        if (i === currentPage) {
            html += '<a href="javascript:;" class="active">' + i + '</a>';
        } else {
            html += '<a href="javascript:;" onclick="goToPage(' + i + ')">' + i + '</a>';
        }
    }
    
    // 下一页
    if (currentPage < totalPages) {
        html += '<a href="javascript:;" onclick="goToPage(' + (currentPage + 1) + ')">下一页 &raquo;</a>';
    }
    
    pagination.innerHTML = html;
}

// 跳转到指定页码
function goToPage(page) {
    currentPage = page;
    loadProcurementList();
}

// 搜索采购单
function searchProcurement() {
    filterParams = {
        order_no: $('#filterOrderNo').val(),
        supplier_id: $('#filterSupplier').val(),
        warehouse_type: $('#filterWarehouseType').val(),
        status: $('#filterStatus').val(),
        start_date: $('#filterStartDate').val(),
        end_date: $('#filterEndDate').val()
    };
    
    // 移除空值参数
    for (var key in filterParams) {
        if (filterParams[key] === '' || filterParams[key] === null || filterParams[key] === undefined) {
            delete filterParams[key];
        }
    }
    
    currentPage = 1;
    loadProcurementList();
}

// 重置筛选
function resetFilter() {
    $('#filterOrderNo').val('');
    $('#filterSupplier').val('');
    $('#filterWarehouseType').val('');
    $('#filterStatus').val('');
    $('#filterStartDate').val('');
    $('#filterEndDate').val('');
    
    filterParams = {};
    currentPage = 1;
    loadProcurementList();
    layui.form.render('select');
}

// 刷新采购单列表
function refreshProcurementList() {
    loadProcurementList();
}

// 查看采购单详情
function viewProcurement(id) {
    var company_id = getUrlParam('company_id');
    var company_type = getUrlParam('company_type');
    
    window.location.href='/?s=index/procurement_detail&id=' + id + 
                '&company_id=' + company_id + 
                '&company_type=' + company_type;
}

// 编辑采购单
function editProcurement(id) {
    layer.confirm('确定要编辑此采购单吗？', function(index){
        // 这里可以跳转到编辑页面
        window.location.href = '/?s=index/create_procurement&company_id=' + 
                              getUrlParam('company_id') + '&company_type=' + 
                              getUrlParam('company_type') + '&edit_id=' + id;
        layer.close(index);
    });
}

// 取消采购单
function cancelProcurement(id) {
    layer.confirm('确定要取消此采购单吗？', function(index){
        $.ajax({
            url: '/?s=index/cancel_procurement',
            type: 'POST',
            data: {
                id: id,
                company_id: getUrlParam('company_id'),
                company_type: getUrlParam('company_type')
            },
            success: function(res){
                if(res.code === 0) {
                    layer.msg('采购单已取消', {icon: 1});
                    loadProcurementList();
                } else {
                    layer.msg(res.msg || '操作失败', {icon: 2});
                }
            }
        });
        layer.close(index);
    });
}

// 完成采购单
function completeProcurement(id) {
    layer.confirm('确定要标记此采购单为已完成吗？', function(index){
        $.ajax({
            url: '/?s=index/complete_procurement',
            type: 'POST',
            data: {
                id: id,
                company_id: getUrlParam('company_id'),
                company_type: getUrlParam('company_type')
            },
            success: function(res){
                if(res.code === 0) {
                    layer.msg('采购单已完成', {icon: 1});
                    loadProcurementList();
                } else {
                    layer.msg(res.msg || '操作失败', {icon: 2});
                }
            }
        });
        layer.close(index);
    });
}

// 创建新采购单
function createNewProcurement() {
    window.location.href = '/?s=index/create_procurement&company_id=' + 
                          getUrlParam('company_id') + '&company_type=' + 
                          getUrlParam('company_type');
}

// 导出采购单数据
function exportProcurementData() {
    var params = {
        company_id: getUrlParam('company_id'),
        company_type: getUrlParam('company_type')
    };
    
    // 添加筛选参数
    Object.assign(params, filterParams);
    
    var queryString = Object.keys(params).map(key => key + '=' + encodeURIComponent(params[key])).join('&');
    
    window.open('/?s=index/export_procurement&' + queryString, '_blank');
}

// 加载采购管理页面
function loadProcurementManage() {
    // 激活采购管理菜单
    document.querySelectorAll('.submenu li').forEach(function(li) {
        li.classList.remove('active');
    });
    
    var procurementMenu = document.querySelector('a[onclick="loadProcurementManage()"]').parentElement;
    if (procurementMenu) {
        procurementMenu.classList.add('active');
    }
    
    // 更新当前菜单名称
    document.querySelector('.current-menu').textContent = '采购管理';
    
    // 刷新数据
    loadProcurementList();
}

// 辅助函数：获取URL参数
function getUrlParam(name) {
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
    var r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURI(r[2]);
    return null;
}

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded', function() {
    
    // 激活采购管理菜单项
    var procurementMenu = document.querySelector('a[onclick="loadProcurementManage()"]');
    if (procurementMenu) {
        procurementMenu.parentElement.classList.add('active');
    }
    
    // 获取URL中的company_id和company_type
    var companyId = getUrlParam('company_id');
    var companyType = getUrlParam('company_type');
    
    if (!companyId || !companyType) {
        layer.msg('缺少必要的参数', {icon: 2});
    }
});
</script>
</body>
</html>
