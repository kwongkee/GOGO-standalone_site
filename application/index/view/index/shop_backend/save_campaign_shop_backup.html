<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独立站平台 - website.gogo198.net</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="layui/css/layui.css">
    <style>
        :root {--primary: #8a2be2;--primary-dark: #6a1cb9;--primary-light: #9b4de3;--secondary: #bb86fc;--accent: #e6d7f5;--text: #333333;--text-light: #f8f8f8;--background: #f9f5fd;--card-bg: #ffffff;--gradient: linear-gradient(135deg, var(--primary), var(--primary-dark));--gradient-light: linear-gradient(135deg, var(--primary-light), var(--secondary));--shadow: 0 10px 30px rgba(138, 43, 226, 0.15);--shadow-hover: 0 15px 35px rgba(138, 43, 226, 0.25);}
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        body {color: var(--text);line-height: 1.6;overflow-x: hidden;}
        h1, h2, h3, h4, h5, h6 {font-family: 'Montserrat', sans-serif;font-weight: 700;}
        .disf{display:flex;align-items: center;}

        .btn {padding: 12px 25px;border-radius: 50px;text-decoration: none;font-weight: 600;transition: all 0.3s ease;cursor: pointer;display: inline-block;text-align: center;border: none;font-family: 'Montserrat', sans-serif;}
        .btn-outline {border: 2px solid var(--primary);color: var(--primary);background: transparent;margin-right: 15px;}
        .btn-outline:hover {background: var(--primary);color: white;transform: translateY(-3px);box-shadow: var(--shadow);}
        .btn-primary {background: var(--gradient);color: white;border: 2px solid transparent;}
        .btn-primary:hover {background: transparent;border-color: var(--primary);color: var(--primary);transform: translateY(-3px);box-shadow: var(--shadow);}
        .btn-default{padding:10px 10px;background: var(--primary);}
        .btn-sm {padding: 8px 15px;font-size: 0.9rem;}

        /* 模态框样式 */
        .modal {display: none;position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0, 0, 0, 0.5);backdrop-filter: blur(5px);z-index: 2000;align-items: center;justify-content: center;}
        .modal-content {background: white;border-radius: 20px;padding: 30px;width: 90%;max-width: 90%;box-shadow: var(--shadow-hover);position: relative;}
        .close-modal {position: absolute;top: 20px;right: 20px;font-size: 1.5rem;color: #999;cursor: pointer;transition: color 0.3s ease;}
        .close-modal:hover {color: var(--primary);}
        .modal-title {font-size: 1.5rem;margin-bottom: 20px;color: var(--primary);}

        /* 表单样式 */
        .form-section {margin-bottom: 30px;}
        .form-title {font-size: 1.3rem;margin-bottom: 20px;color: var(--primary-dark);display: flex;align-items: center}
        .form-title i {margin-right: 10px;}
        .form-grid {display: grid;grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));gap: 20px;}
        .form-group {margin-bottom: 20px;}
        .form-group label {display: block;margin-bottom: 8px;font-weight: 600;color: var(--primary-dark);}
        .form-group input,
        .form-group select,
        .form-group textarea {width: 100%;padding: 15px;border: 2px solid #e0e0e0;border-radius: 10px;font-size: 1rem;transition: border-color 0.3s ease;}
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {border-color: var(--primary);outline: none;}
        .form-group textarea {min-height: 120px;resize: vertical;}
        .form-actions {display: flex;justify-content: flex-end;gap: 15px;margin-top: 30px;padding-top: 20px;border-top: 2px solid var(--accent);}

        .sel_container .sel_line{margin-bottom:5px;}
        .trush_box{display:none;}
        .trush_box .trush{padding: 6px 6px;border: 1px solid #efefef;color: #6d6d6d;cursor: pointer;}
        .currency_symbol{font-size: 15px;}
        .amount{margin-left:5px;font-size: 15px;}

        /* 地图相关样式 */
        .map-container {margin-top: 10px;border-radius: 10px;overflow: hidden;box-shadow: var(--shadow);}
        #mapContainer {width: 100%;height: 400px;}
        .search-box {display: flex;gap: 10px;margin-bottom: 15px;}
        .search-box input {flex: 1;}
        .coordinates-display {background: var(--accent);padding: 15px;border-radius: 10px;margin-top: 15px;font-family: monospace;font-size: 0.95rem;}
        .coordinates-display span {color: var(--primary-dark);font-weight: 600;}
        .map-instructions {color: #666;font-size: 0.9rem;margin-top: 10px;}
        .map-instructions i {color: var(--primary);margin-right: 5px;}

        /* 动画 */
        @keyframes fadeIn {
            from {opacity: 0;transform: translateY(10px);}
            to {opacity: 1;transform: translateY(0);}
        }

        @media (max-width: 576px) {
            .btn {padding: 10px 20px;font-size: 0.9rem;}
            #mapContainer {height: 300px;}
            .search-box {flex-direction: column;}
        }

        /*自定义颜色配置*/
        .layui-colorpicker.layui-colorpicker-lg,.layui-colorpicker-trigger-i.layui-icon-close{line-height: 24px;}
        .layui-colorpicker, .layui-colorpicker-trigger-span{border-color:#777;}
        .layui-colorpicker-main-input .layui-btn-container .layui-btn {margin: 0 0 0 5px;}
        .layui-form-item .layui-form-label{width:100px;}

        .edui-editor{z-index: 1 !important;}
    </style>
</head>
<body>
<form id="siteForm" class="layui-form" action="" method="post" lay-filter="component-form-menu" style="padding:10px;margin-bottom:0px;">
    <input type="hidden" name="company_id" value="{$company_id}">
    <input type="hidden" name="company_type" value="{$company_type}">
    <input type="hidden" name="id" value="{$id}">
    <!-- 新增的经纬度隐藏字段 -->
    <input type="hidden" name="shop_longitude" id="shop_longitude" value="{$data['shop_longitude']}">
    <input type="hidden" name="shop_latitude" id="shop_latitude" value="{$data['shop_latitude']}">
    
    <div class="layui-form-item">
        <div class="layui-form-label">店名</div>
        <div class="layui-input-block">
            <input type="text" class="layui-input" name="shop_name" value="{$data['shop_name']}" lay-verify="required" />
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-form-label">地址</div>
        <div class="layui-input-block">
            <input type="text" class="layui-input" name="shop_address" id="shop_address" value="{$data['shop_address']}" lay-verify="required" />
        </div>
    </div>
    
    <!-- 新增的地图选点部分 -->
    <div class="layui-form-item">
        <div class="layui-form-label">地图选点</div>
        <div class="layui-input-block">
            <div class="search-box">
                <input type="text" id="searchAddress" class="layui-input" placeholder="输入地址进行搜索..." />
                <button type="button" id="searchBtn" class="btn btn-sm btn-primary">搜索</button>
                <button type="button" id="useCurrentBtn" class="btn btn-sm btn-outline">使用当前地址</button>
            </div>
            
            <div class="map-container">
                <div id="mapContainer"></div>
            </div>
            
            <div class="coordinates-display">
                <p>当前位置坐标：</p>
                <p>经度：<span id="lngDisplay">{$data['shop_longitude']}</span></p>
                <p>纬度：<span id="latDisplay">{$data['shop_latitude']}</span></p>
                <p class="map-instructions"><i class="fa fa-info-circle"></i> 提示：在地图上点击可以重新选择位置，拖动标记可微调位置</p>
            </div>
        </div>
    </div>
    
    <div class="layui-form-item">
        <div class="layui-form-label">电话</div>
        <div class="layui-input-block">
            <input type="text" name="shop_tel" class="layui-input" value="{$data['shop_tel']}" lay-verify="required" />
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-form-label">营业时间</div>
        <div class="layui-input-block">
            <input type="text" name="shop_hours" class="layui-input" value="{$data['shop_hours']}" lay-verify="required" />
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-outline" id="cancelBtnMenu" style="background:transparent;border: 2px solid var(--primary);color: var(--primary);display:none;">取消</button>
        <button type="submit" class="btn btn-primary" lay-submit lay-filter="component-form-menu2">立即保存</button>
    </div>
</form>

<!-- 使用高德地图最新版API -->
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=b4df4fb3f9be1f95d4b4ccf30fd97729&plugin=AMap.ToolBar,AMap.Scale,AMap.Geocoder,AMap.PlaceSearch"></script>
<script src="js/jquery-3.6.0.min.js"></script>
<script src="layui/layui.js"></script>
<script>
// 全局变量
var map = null;
var marker = null;
var geocoder = null;
var placeSearch = null;

// 从PHP变量获取初始经纬度
var initialLng = "{$data['shop_longitude']}" || "116.397428";
var initialLat = "{$data['shop_latitude']}" || "39.90923";
var initialAddress = "{$data['shop_address']}" || "";

// 检查高德地图是否加载完成
function checkAMapLoaded() {
    return new Promise((resolve) => {
        if (window.AMap) {
            resolve();
            return;
        }
        
        // 等待加载
        var checkInterval = setInterval(() => {
            if (window.AMap) {
                clearInterval(checkInterval);
                resolve();
            }
        }, 100);
        
        // 10秒超时
        setTimeout(() => {
            clearInterval(checkInterval);
            resolve(); // 即使超时也继续
        }, 10000);
    });
}

// 初始化地图
async function initMap() {
    try {
        // 等待AMap加载完成
        await checkAMapLoaded();
        
        if (!window.AMap) {
            throw new Error('高德地图加载失败');
        }
        
        console.log('AMap loaded:', AMap);
        
        // 创建地图实例
        map = new AMap.Map('mapContainer', {
            zoom: 15,
            center: [initialLng, initialLat],
            resizeEnable: true,
            viewMode: '2D'
        });
        
        console.log('Map created');
        
        // 添加控件
        try {
            map.addControl(new AMap.ToolBar({
                position: 'LT'
            }));
            map.addControl(new AMap.Scale({
                position: 'LB'
            }));
            console.log('Controls added');
        } catch (controlError) {
            console.warn('添加控件失败:', controlError);
        }
        
        // 初始化地理编码和地点搜索
        try {
            geocoder = new AMap.Geocoder({
                city: "全国"
            });
            
            placeSearch = new AMap.PlaceSearch({
                pageSize: 5,
                pageIndex: 1,
                city: "全国",
                map: map,
                panel: "panel"
            });
            
            console.log('Services initialized');
        } catch (serviceError) {
            console.warn('初始化服务失败:', serviceError);
        }
        
        // 如果有初始经纬度，添加标记
        if (initialLng && initialLat) {
            addMarker(initialLng, initialLat);
            
            // 如果有地址但无经纬度，则通过地址获取经纬度
            if (initialAddress && (!initialLng || initialLng === "116.397428")) {
                setTimeout(() => {
                    searchByAddress(initialAddress);
                }, 1000);
            }
        }
        
        // 地图点击事件
        map.on('click', function(e) {
            addMarker(e.lnglat.getLng(), e.lnglat.getLat());
            reverseGeocode(e.lnglat.getLng(), e.lnglat.getLat());
        });
        
        console.log('Map initialization complete');
        return true;
        
    } catch (error) {
        console.error('地图初始化失败:', error);
        // 显示错误信息但继续运行
        if (window.layer) {
            layer.msg('地图加载异常，但基本功能可用', {time: 3000});
        }
        return false;
    }
}

// 添加标记
function addMarker(lng, lat) {
    try {
        // 清除现有标记
        if (marker) {
            map.remove(marker);
        }
        
        // 创建新标记
        marker = new AMap.Marker({
            position: [lng, lat],
            draggable: true,
            cursor: 'move'
        });
        
        // 添加标记到地图
        map.add(marker);
        
        // 设置地图中心点
        map.setCenter([lng, lat]);
        
        // 更新坐标显示
        updateCoordinates(lng, lat);
        
        // 标记拖拽事件
        marker.on('dragend', function(e) {
            var position = marker.getPosition();
            updateCoordinates(position.lng, position.lat);
            reverseGeocode(position.lng, position.lat);
        });
    } catch (error) {
        console.error('添加标记失败:', error);
    }
}

// 更新坐标显示
function updateCoordinates(lng, lat) {
    $('#lngDisplay').text(lng);
    $('#latDisplay').text(lat);
    $('#shop_longitude').val(lng);
    $('#shop_latitude').val(lat);
}

// 逆地理编码（根据坐标获取地址）
function reverseGeocode(lng, lat) {
    if (!geocoder) {
        console.error('地理编码器未初始化');
        return;
    }
    
    geocoder.getAddress([lng, lat], function(status, result) {
        if (status === 'complete' && result.regeocode) {
            var address = result.regeocode.formattedAddress;
            $('#shop_address').val(address);
        }
    });
}

// 根据地址搜索
function searchByAddress(address) {
    if (!geocoder) {
        console.error('地理编码器未初始化');
        layer.msg('搜索功能暂不可用', {time: 2000});
        return;
    }
    
    if (!address || address.trim() === '') {
        layer.msg('请输入搜索地址', {time: 2000});
        return;
    }
    
    layer.load(2, {time: 10*1000});
    
    geocoder.getLocation(address, function(status, result) {
        layer.closeAll('loading');
        
        if (status === 'complete' && result.geocodes && result.geocodes.length > 0) {
            var geocode = result.geocodes[0];
            var location = geocode.location;
            addMarker(location.getLng(), location.getLat());
            layer.msg('已找到位置', {time: 1500});
        } else {
            layer.msg('未找到相关地址，请尝试更详细的地址', {time: 2000});
        }
    });
}

// 使用当前地址定位
function useCurrentAddress() {
    var address = $('#shop_address').val();
    if (address && address.trim() !== '') {
        searchByAddress(address);
    } else {
        layer.msg('请先输入地址', {time: 2000});
    }
}

layui.use(['layer','form','laydate','upload','colorpicker'],function() {
    var laydate = layui.laydate
        ,layer = layui.layer
        ,form = layui.form
        ,$ = layui.$
        ,upload = layui.upload
        ,colorpicker = layui.colorpicker;
    
    // 初始化地图
    initMap().then((success) => {
        if (!success) {
            layer.msg('地图初始化失败，部分功能可能不可用', {time: 3000});
        }
        
        // 搜索按钮点击事件
        $('#searchBtn').on('click', function() {
            var address = $('#searchAddress').val();
            if (!address) {
                // 如果搜索框为空，尝试使用地址框的值
                address = $('#shop_address').val();
                if (address) {
                    $('#searchAddress').val(address);
                } else {
                    layer.msg('请输入搜索地址', {time: 2000});
                    return;
                }
            }
            
            searchByAddress(address);
        });
        
        // 使用当前地址按钮点击事件
        $('#useCurrentBtn').on('click', function() {
            useCurrentAddress();
        });
        
        // 搜索输入框回车事件
        $('#searchAddress').on('keypress', function(e) {
            if (e.which == 13) {
                var address = $('#searchAddress').val();
                searchByAddress(address);
                return false;
            }
        });
        
        // 地址输入框变化时同步到搜索框
        $('#shop_address').on('input', function() {
            $('#searchAddress').val($(this).val());
        });
    });
    
    // 表单提交
    form.on('submit(component-form-menu2)', function(data){
        // 验证经纬度是否已设置
        var lng = $('#shop_longitude').val();
        var lat = $('#shop_latitude').val();
        
        if (!lng || !lat || lng === "116.397428") {
            layer.confirm('您还没有设置店铺位置，确定要保存吗？', {
                btn: ['确定保存', '返回设置']
            }, function() {
                submitForm(data);
            }, function() {
                layer.msg('请在地图上选择店铺位置', {time: 2000});
            });
            return false;
        }
        
        submitForm(data);
        return false;
    });
    
    // 提交表单的函数
    function submitForm(data) {
        layer.load();
        $.ajax({
            url:"/?s=index/save_campaign_shop",
            method:'post',
            data:data.field,
            dataType:'JSON',
            success:function(res){
                layer.closeAll('loading');
                layer.msg(res.msg,{time:2000}, function () {
                    if(res.code == 0)
                    {
                        parent.location.reload();
                    }
                });
            },
            error:function (data) {
                layer.closeAll('loading');
                layer.msg('系统错误',{time:2000});
            }
        });
    }
});
</script>
</body>
</html>
