<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>采购单详情</title>
    <link rel="stylesheet" href="layui/css/layui.css">
    <style>
        body {
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .detail-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .detail-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .detail-header {
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        .detail-header h2 {
            font-size: 20px;
            color: #333;
            margin: 0;
        }
        
        .detail-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .status-1 { background-color: #ffedd5; color: #c2410c; }
        .status-2 { background-color: #dbeafe; color: #1e40af; }
        .status-3 { background-color: #fef3c7; color: #92400e; }
        .status-4 { background-color: #d1fae5; color: #065f46; }
        .status-5 { background-color: #dcfce7; color: #166534; }
        .status-6 { background-color: #fee2e2; color: #991b1b; }
        
        .detail-section {
            margin-bottom: 25px;
        }
        
        .detail-section h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #9b4de3;
        }
        
        .detail-row {
            display: flex;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        
        .detail-label {
            width: 150px;
            font-weight: bold;
            color: #666;
        }
        
        .detail-value {
            flex: 1;
            color: #333;
        }
        
        .goods-table {
            width: 100%;
            margin-top: 10px;
        }
        
        .goods-table th {
            background-color: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #eaeaea;
        }
        
        .goods-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .money-amount {
            color: #ff5722;
            font-weight: bold;
        }
        
        .back-btn {
            margin-top: 20px;
            text-align: center;
        }
        
        .freight-config {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }
        /*返回按钮*/
        .backDiv{padding: 5px 5px 5px 20px;border-bottom: 1px solid #d9d9d9;}
        .backDiv .backBox{display: flex;align-items: center;cursor: pointer;}
        .backDiv .back_icon{font-size: 18px;color: #333;margin-right: 10px;position: relative;}
        .backDiv .back_icon:before{content:'';position:absolute;width:9px;height:9px;border-left:2px solid #000;border-top:2px solid #000;transform:rotate(-45deg);margin-right:5px;top:-7px;}
        .backDiv .back_text{font-size: 16px;color: #333;font-weight: 500;margin-left: 5px;}
    </style>
</head>
<body>
    <div class="backDiv">
        <div class="backBox" onclick="javascript:window.history.back(-1);">
            <div class="back_icon"></div>
            <div class="back_text">返回</div>
        </div>
    </div>
    <div class="detail-container">
        <div class="detail-card">
            <div class="detail-header">
                <h2>
                    采购单详情
                    <span class="detail-status" id="statusBadge">待处理</span>
                </h2>
                <div class="detail-row">
                    <span class="detail-label">采购单号：</span>
                    <span class="detail-value" id="procurementId">--</span>
                </div>
            </div>
            
            <!-- 基本信息 -->
            <div class="detail-section">
                <h3>基本信息</h3>
                <div class="detail-row">
                    <span class="detail-label">供应商：</span>
                    <span class="detail-value" id="supplierName">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">仓库类型：</span>
                    <span class="detail-value" id="warehouseType">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">仓库：</span>
                    <span class="detail-value" id="warehouseName">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">创建时间：</span>
                    <span class="detail-value" id="createTime">--</span>
                </div>
            </div>
            
            <!-- 商品清单 -->
            <div class="detail-section">
                <h3>商品清单</h3>
                <table class="goods-table" id="goodsTable">
                    <thead>
                        <tr>
                            <th>商品名称</th>
                            <th>规格</th>
                            <th>数量</th>
                            <th>单价</th>
                            <th>税率</th>
                            <th>小计</th>
                        </tr>
                    </thead>
                    <tbody id="goodsList">
                        <!-- 动态加载 -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="5" style="text-align: right; font-weight: bold;">商品总金额：</td>
                            <td class="money-amount" id="goodsTotal">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            
            <!-- 运费配置 -->
            <div class="detail-section" id="freightConfigSection">
                <h3>运费配置</h3>
                <div id="freightConfigInfo">
                    <!-- 动态加载 -->
                </div>
            </div>
            
            <!-- 结算信息 -->
            <div class="detail-section">
                <h3>结算信息</h3>
                <div class="detail-row">
                    <span class="detail-label">结算方式：</span>
                    <span class="detail-value" id="paymentMethod">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">供应商货币：</span>
                    <span class="detail-value" id="supplierCurrency">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">收费项目总额：</span>
                    <span class="detail-value money-amount" id="projectTotal">0.00</span>
                </div>
            </div>
            
            <!-- 物流信息 -->
            <div class="detail-section" id="logisticsSection">
                <h3>物流信息</h3>
                <div class="detail-row">
                    <span class="detail-label">物流企业：</span>
                    <span class="detail-value" id="deliveryCompany">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">物流方式：</span>
                    <span class="detail-value" id="deliveryMethod">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">运抵时间：</span>
                    <span class="detail-value" id="deliveryTime">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">运单编码：</span>
                    <span class="detail-value" id="deliveryNo">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">收货备注：</span>
                    <span class="detail-value" id="deliveryRemark">--</span>
                </div>
            </div>
            
            <!-- 金额汇总 -->
            <div class="detail-section">
                <h3>金额汇总</h3>
                <div class="detail-row">
                    <span class="detail-label">商品总金额：</span>
                    <span class="detail-value money-amount" id="goodsTotalAmount">0.00</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">项目总金额：</span>
                    <span class="detail-value money-amount" id="projectTotalAmount">0.00</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">运费：</span>
                    <span class="detail-value money-amount" id="freightTotal">0.00</span>
                </div>
                <div class="detail-row" style="border-top: 2px solid #9b4de3; padding-top: 15px; margin-top: 15px;">
                    <span class="detail-label" style="font-size: 16px;">总金额：</span>
                    <span class="detail-value money-amount" style="font-size: 18px;" id="totalAmount">0.00</span>
                </div>
            </div>
            
            <!--<div class="back-btn">-->
            <!--    <button class="layui-btn layui-btn-primary" onclick="window.close()">关闭</button>-->
            <!--</div>-->
        </div>
    </div>

<script src="layui/layui.js"></script>
<script src="js/jquery-3.6.0.min.js"></script>
<script>
var procurementId = getUrlParam('id');

$(document).ready(function() {
    if (procurementId) {
        loadProcurementDetail(procurementId);
    } else {
        layui.layer.msg('未找到采购单', {icon: 2});
    }
});

function loadProcurementDetail(id) {
    // layui.layer.load(2);
    
    $.ajax({
        url: '/?s=index/get_procurement_detail',
        type: 'GET',
        data: {id: id},
        dataType: 'json',
        success: function(res){
            // layui.layer.closeAll('loading');
            if(res.code === 0) {
                renderProcurementDetail(res.data);
            } else {
                layui.layer.msg(res.msg || '加载失败', {icon: 2});
            }
        },
        error: function(){
            // layui.layer.closeAll('loading');
            layui.layer.msg('网络错误，请重试', {icon: 2});
        }
    });
}

function renderProcurementDetail(data) {
    // 采购单基本信息
    $('#procurementId').text(data.id);
    $('#createTime').text(formatTime(data.createtime));
    $('#statusBadge').text(getStatusText(data.status));
    $('#statusBadge').attr('class', 'detail-status status-' + data.status);
    
    // 供应商信息
    if (data.supplier) {
        $('#supplierName').text(data.supplier.company_name || '--');
    }
    
    // 仓库信息
    $('#warehouseType').text(data.warehouse_type === 'direct' ? '直接发货' : '代发货');
    if (data.warehouse) {
        $('#warehouseName').text(data.warehouse.warehouse_name || '--');
    }
    
    // 商品清单
    renderGoodsList(data.goods_info);
    
    // 结算信息
    renderSettlementInfo(data);
    
    // 物流信息
    renderLogisticsInfo(data);
    
    // 运费配置
    if (data.freight_config_id) {
        loadFreightConfigDetail(data.freight_config_id);
    } else {
        $('#freightConfigSection').hide();
    }
    
    // 金额汇总
    $('#goodsTotalAmount').text('¥' + (parseFloat(data.goods_total_price) || 0).toFixed(2));
    $('#projectTotalAmount').text('¥' + (parseFloat(data.project_total_price) || 0).toFixed(2));
    $('#freightTotal').text('¥' + (parseFloat(data.freight_total_price) || 0).toFixed(2));
    $('#totalAmount').text('¥' + (parseFloat(data.total_price) || 0).toFixed(2));
}

function renderGoodsList(goodsInfo) {
    if (!goodsInfo || !Array.isArray(goodsInfo)) {
        $('#goodsList').html('<tr><td colspan="6" style="text-align: center;">暂无商品</td></tr>');
        return;
    }
    
    var html = '';
    var goodsTotal = 0;
    
    goodsInfo.forEach(function(item) {
        var subtotal = parseFloat(item.goods_line_total || item.subtotal || 0);
        goodsTotal += subtotal;
        
        html += '<tr>';
        html += '<td>' + (item.goods_name || '--') + '</td>';
        html += '<td>' + (item.sku_name || item.spec_names || '--') + '</td>';
        html += '<td>' + (item.goods_quantity || item.quantity || 0) + '</td>';
        html += '<td>¥' + (parseFloat(item.goods_price || item.price || 0).toFixed(2)) + '</td>';
        html += '<td>' + (item.goods_tax || item.tax_rate || 0) + '%</td>';
        html += '<td class="money-amount">¥' + subtotal.toFixed(2) + '</td>';
        html += '</tr>';
    });
    
    $('#goodsList').html(html);
    $('#goodsTotal').text('¥' + goodsTotal.toFixed(2));
}

function renderSettlementInfo(data) {
    // 结算方式
    var paymentMethods = {
        '0': '无',
        '1': '货到付款',
        '2': '收货后付款',
        '3': '预付款',
        '4': 'Net 7',
        '5': 'Net 15',
        '6': 'Net 30',
        '7': 'Net 45',
        '8': 'Net 60'
    };
    
    $('#paymentMethod').text(paymentMethods[data.payment_method] || '--');
    
    // 货币
    var currencies = {
        '5': 'CNY',
        '1': 'USD',
        '2': 'EUR'
    };
    
    $('#supplierCurrency').text(currencies[data.supplier_currency] || 'CNY');
    
    // 收费项目
    if (data.charge_items && data.charge_items.length > 0) {
        var projectTotal = 0;
        var projectHtml = '<table class="goods-table" style="margin-top: 10px;">';
        projectHtml += '<thead><tr><th>项目名称</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>';
        projectHtml += '<tbody>';
        
        data.charge_items.forEach(function(item) {
            var subtotal = (parseFloat(item.price) || 0) * (parseInt(item.quantity) || 0);
            projectTotal += subtotal;
            
            projectHtml += '<tr>';
            projectHtml += '<td>' + (item.name || '--') + '</td>';
            projectHtml += '<td>¥' + (parseFloat(item.price || 0).toFixed(2)) + '</td>';
            projectHtml += '<td>' + (item.quantity || 0) + '</td>';
            projectHtml += '<td class="money-amount">¥' + subtotal.toFixed(2) + '</td>';
            projectHtml += '</tr>';
        });
        
        projectHtml += '</tbody>';
        projectHtml += '<tfoot><tr><td colspan="3" style="text-align: right; font-weight: bold;">合计：</td>';
        projectHtml += '<td class="money-amount">¥' + projectTotal.toFixed(2) + '</td></tr></tfoot>';
        projectHtml += '</table>';
        
        $('.detail-section:contains("结算信息")').append(projectHtml);
    }
    
    $('#projectTotal').text('¥' + (parseFloat(data.project_total_price) || 0).toFixed(2));
}

function renderLogisticsInfo(data) {
    // 如果是代发货仓库，隐藏物流信息
    if (data.warehouse_type === 'proxy') {
        $('#logisticsSection').hide();
        return;
    }
    
    if (data.delivery_id) {
        // 这里可以调用接口获取物流企业名称
        // 暂时显示ID
        $('#deliveryCompany').text(data.delivery_id);
    }
    
    // 物流方式
    var deliveryMethods = {
        '1': '陆运',
        '2': '空运',
        '3': '海运',
        '4': '铁路运输'
    };
    
    $('#deliveryMethod').text(deliveryMethods[data.delivery_method] || '--');
    $('#deliveryTime').text(data.delivery_time || '--');
    $('#deliveryNo').text(data.delivery_no || '--');
    $('#deliveryRemark').text(data.delivery_remark || '--');
}

function loadFreightConfigDetail(configId) {
    $.ajax({
        url: '/?s=index/get_freight_config_detail',
        type: 'GET',
        data: {id: configId},
        dataType: 'json',
        success: function(res){
            if(res.code === 0) {
                renderFreightConfigDetail(res.data);
            }
        }
    });
}

function renderFreightConfigDetail(config) {
    var html = '<div class="freight-config">';
    
    // 基本信息
    html += '<div style="margin-bottom: 15px;">';
    html += '<div><strong>快递企业：</strong>' + (config.express_info ? config.express_info.name : '--') + '</div>';
    html += '<div><strong>产品类型：</strong>' + (config.product_type || '--') + '</div>';
    
    if (config.warehouse_type === 'direct' && config.terminal_id) {
        html += '<div><strong>终端ID：</strong>' + config.terminal_id + '</div>';
    }
    
    html += '</div>';
    
    // 配置详情
    if (config.config_data) {
        html += '<div>';
        html += '<div><strong>配置详情：</strong></div>';
        html += '<pre style="background: white; padding: 10px; border-radius: 4px; margin-top: 5px; max-height: 200px; overflow-y: auto;">';
        html += JSON.stringify(config.config_data, null, 2);
        html += '</pre>';
        html += '</div>';
    }
    
    html += '</div>';
    
    $('#freightConfigInfo').html(html);
}

function getStatusText(status) {
    var statusMap = {
        1: '待处理',
        2: '已确认',
        3: '采购中',
        4: '已发货',
        5: '已完成',
        6: '已取消'
    };
    
    return statusMap[status] || '未知状态';
}

function formatTime(timestamp) {
    if (!timestamp) return '--';
    
    var date = new Date(timestamp * 1000);
    return date.getFullYear() + '-' + 
           padZero(date.getMonth() + 1) + '-' + 
           padZero(date.getDate()) + ' ' + 
           padZero(date.getHours()) + ':' + 
           padZero(date.getMinutes()) + ':' + 
           padZero(date.getSeconds());
}

function padZero(num) {
    return num < 10 ? '0' + num : num;
}

function getUrlParam(name) {
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
    var r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURI(r[2]);
    return null;
}
</script>
</body>
</html>
